<!DOCTYPE html>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <link href="styles.css" rel="stylesheet">

    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">MySite</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About Me</a></li>
                        <li class="nav-item"><a class="nav-link" href="hobbies.html">Hobbies</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <h2 class="mb-4 text-center">Get in Touch</h2>

                    <!-- كروت السوشيال ميديا (Instagram & Discord) -->
                    <div class="row mb-5 text-center">
                        <div class="col-md-6 mb-3">
                            <div class="card h-100 shadow-sm border-0 bg-light">
                                <div class="card-body">
                                    <h5 class="card-title text-danger fw-bold">Instagram</h5>
                                    <p class="card-text fs-5"><code>a.ra7man.m</code></p>
                                    <a href="https://instagram.com/a.ra7man.m" target="_blank" class="btn btn-outline-danger btn-sm">Visit Profile</a>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="card h-100 shadow-sm border-0 bg-light">
                                <div class="card-body">
                                    <h5 class="card-title text-primary fw-bold">Discord</h5>
                                    <p class="card-text fs-5"><code>a.elalphy</code></p>
                                    <span class="badge bg-secondary">Username</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- نموذج المراسلة -->
                    <div class="card shadow-sm p-4">
                        <h4 class="mb-3">Send a Message</h4>
                        <form>
                            <div class="mb-3">
                                <label for="emailInput" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="emailInput" placeholder="name@example.com">
                            </div>
                            <div class="mb-3">
                                <label for="messageInput" class="form-label">Message</label>
                                <textarea class="form-control" id="messageInput" rows="4" placeholder="Write your message here..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <footer class="text-center py-3 bg-dark text-white mt-auto">
            <p class="mb-0">&copy; 2026 My Personal Site</p>
        </footer>
