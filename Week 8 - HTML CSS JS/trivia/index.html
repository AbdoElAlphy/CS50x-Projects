<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                let correctBtn = document.querySelector('.correct');
                correctBtn.addEventListener('click', function() {
                    correctBtn.style.backgroundColor = 'green';
                    document.querySelector('#part1-feedback').innerHTML = 'Correct!';
                });

                let incorrectBtns = document.querySelectorAll('.incorrect');
                for (let i = 0; i < incorrectBtns.length; i++) {
                    incorrectBtns[i].addEventListener('click', function() {
                        incorrectBtns[i].style.backgroundColor = 'red';
                        document.querySelector('#part1-feedback').innerHTML = 'Incorrect';
                    });
                }

                let checkBtn = document.querySelector('#check');
                checkBtn.addEventListener('click', function() {
                    let input = document.querySelector('input');
                    if (input.value.trim().toLowerCase() === 'switzerland') {
                        input.style.backgroundColor = 'green';
                        document.querySelector('#part2-feedback').innerHTML = 'Correct!';
                    } else {
                        input.style.backgroundColor = 'red';
                        document.querySelector('#part2-feedback').innerHTML = 'Incorrect';
                    }
                });
            });
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice</h2>
                <hr>
                <h3>What is the approximate ratio of people to sheep in New Zealand?</h3>
                <button class="incorrect">6 people per 1 sheep</button>
                <button class="incorrect">3 people per 1 sheep</button>
                <button class="incorrect">1 person per 1 sheep</button>
                <button class="incorrect">1 person per 3 sheep</button>
                <button class="correct">1 person per 6 sheep</button>
                <p id="part1-feedback"></p>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <h3>In which country is it illegal to own only one guinea pig, as a lone guinea pig might get lonely?</h3>
                <input type="text">
                <button id="check">Check Answer</button>
                <p id="part2-feedback"></p>
            </div>
        </div>
    </body>
</html>
